# Spec 12.2. Runs on every push and pull request with recorded model responses only:
# no secrets, no billed calls, deterministic. Steps are numbered as in the spec.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"
  MODEL_API_KEY: invalid

jobs:
  frontend:
    name: React TypeScript tests and production build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - run: npm ci
        working-directory: web-next
      - run: npm test
        working-directory: web-next
      - run: npm run build
        working-directory: web-next

  lint:
    name: 1. ruff + NFR-004 grep
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: No Contributor-mode model IDs (NFR-004)
        run: |
          if grep -rnE --include='*.py' --include='*.js' --include='*.json' --include='*.yaml' \
               -e '["'"'"'][a-z0-9.-]+-contributor["'"'"']' vigil web scripts config; then
            echo "::error::Contributor-mode model ID found"; exit 1
          fi

  secrets:
    name: 2. gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  test:
    name: 3-6. P0 suites (blocking) + full suite and determinism (report-only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: ffmpeg + exiftool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libimage-exiftool-perl
      - run: uv sync --locked
      - name: 3. Blocking P0 suites 1-4 (privacy, validator, verdict + rules, guards + budget)
        run: >-
          uv run pytest -q tests/unit/test_privacy.py tests/unit/test_validator.py
          tests/unit/test_verdict.py tests/unit/test_rules.py
          tests/unit/test_budget.py tests/integration/test_guards.py
      - name: 5. Report-only — every other unit, property and integration test
        continue-on-error: true
        run: uv run pytest -q
      - name: 6. Report-only — determinism (NFR-011), pipeline twice, byte-identical visits.json
        continue-on-error: true
        run: uv run pytest -q tests/integration/test_determinism.py -p no:cacheprovider

  scans:
    name: 5. privacy + metadata scan (demo/)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: ffmpeg + exiftool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libimage-exiftool-perl
      - run: uv sync --locked
      - name: Privacy scan (NFR-001, NFR-002)
        run: uv run python scripts/privacy_scan.py demo
      - name: Metadata scan (NFR-032)
        run: uv run python scripts/metadata_scan.py demo
      - name: Metadata scan regression (real generated EXIF, missing tool fails closed)
        run: uv run pytest -q tests/unit/test_metadata_scan.py
      - name: Tracked UI screenshot provenance, audio and metadata (no footage exceptions)
        run: uv run python scripts/scan_ui_evidence.py
      - name: Repository-wide audio allowlist (NFR-002) — only consented voice fixtures
        run: |
          uv run python - <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          allow_path = pathlib.Path("config/audio_fixtures.json")
          allowed = set()
          if allow_path.exists():
              allowed = {f["sha256"] for f in json.loads(allow_path.read_text())["fixtures"]}
          exts = (".wav", ".mp3", ".m4a", ".ogg", ".webm", ".flac", ".aac", ".opus")
          files = [f for f in subprocess.check_output(["git", "ls-files"], text=True).split() if f.lower().endswith(exts)]
          bad = [f for f in files if hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest() not in allowed]
          print(f"audio files tracked: {len(files)}; not allowlisted: {len(bad)}")
          for f in bad:
              print(f"::error::audio file not in config/audio_fixtures.json: {f}")
          sys.exit(1 if bad else 0)
          PY

  sandbox-e2e:
    name: 6-8. Docker sandbox + Playwright E2E
    runs-on: ubuntu-24.04
    needs: [lint, test, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: 6. Build the sandbox image
        run: docker build -t vigil-sandbox:ci .
      - name: 6. Start it with VIGIL_MODE=sandbox and an invalid key (NFR-009)
        # The Meta base URL points at a closed local port, so any live call fails fast and
        # falls back to the recorded result; CI never reaches the real API.
        run: |
          docker run -d --name vigil -p 8000:8000 \
            -e VIGIL_MODE=sandbox -e MODEL_API_KEY=ci-sentinel-invalid-key-7f3a \
            -e VIGIL_META_BASE_URL=http://127.0.0.1:9/v1 vigil-sandbox:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && exit 0; sleep 1
          done
          docker logs vigil; exit 1
      - name: Key never served (NFR-014)
        run: |
          if curl -fsS http://127.0.0.1:8000/ http://127.0.0.1:8000/api/health | grep -q 'ci-sentinel-invalid-key-7f3a'; then
            echo "::error::API key text found in a served response"; exit 1
          fi
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - name: 8. Blocking P0 suite 5 — judge path E2E against the container (offline key)
        env:
          VIGIL_E2E_BASE_URL: http://127.0.0.1:8000
        run: uv run pytest -m e2e tests/e2e/test_judge_path.py -q --tracing retain-on-failure --screenshot only-on-failure --output test-results/judge
      - name: 8. Report-only — mobile E2E (NFR-017)
        continue-on-error: true
        env:
          VIGIL_E2E_BASE_URL: http://127.0.0.1:8000
        run: uv run pytest -m e2e tests/e2e/test_mobile.py -q --tracing retain-on-failure --screenshot only-on-failure --output test-results/mobile
      - name: Container logs
        if: always()
        run: docker logs vigil || true
      - name: 8. Upload Playwright traces and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence
          path: test-results/
          if-no-files-found: ignore
