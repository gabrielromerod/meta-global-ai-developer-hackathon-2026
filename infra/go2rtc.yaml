# Optional AC-only restreamer. Not installed or contacted by this task.
# Battery Argus/PT cameras use imported clips; never add them to continuous streams.
# Event capture uses sub-stream pre-roll and opens main only on a person/vehicle event.
# Credentials stay in environment; no audio/backchannel; no public ports.
streams:
  front_left_duo:
  - rtsp://${REOLINK_USER}:${REOLINK_PASSWORD}@${REOLINK_FRONT_LEFT_DUO_HOST}:554/Preview_01_main#media=video#backchannel=0
  front_left_duo_sub:
  - rtsp://${REOLINK_USER}:${REOLINK_PASSWORD}@${REOLINK_FRONT_LEFT_DUO_HOST}:554/Preview_01_sub#media=video#backchannel=0
  front_right_duo:
  - rtsp://${REOLINK_USER}:${REOLINK_PASSWORD}@${REOLINK_FRONT_RIGHT_DUO_HOST}:554/Preview_01_main#media=video#backchannel=0
  front_right_duo_sub:
  - rtsp://${REOLINK_USER}:${REOLINK_PASSWORD}@${REOLINK_FRONT_RIGHT_DUO_HOST}:554/Preview_01_sub#media=video#backchannel=0
  doorbell:
  - rtsp://${REOLINK_USER}:${REOLINK_PASSWORD}@${REOLINK_DOORBELL_HOST}:554/Preview_01_main#media=video#backchannel=0
  doorbell_sub:
  - rtsp://${REOLINK_USER}:${REOLINK_PASSWORD}@${REOLINK_DOORBELL_HOST}:554/Preview_01_sub#media=video#backchannel=0
  porch:
  - rtsp://${REOLINK_USER}:${REOLINK_PASSWORD}@${REOLINK_PORCH_HOST}:554/Preview_01_main#media=video#backchannel=0
  porch_sub:
  - rtsp://${REOLINK_USER}:${REOLINK_PASSWORD}@${REOLINK_PORCH_HOST}:554/Preview_01_sub#media=video#backchannel=0
api:
  listen: ${GO2RTC_LAN_BIND:127.0.0.1}:1984
rtsp:
  listen: 127.0.0.1:8554
webrtc:
  listen: ${GO2RTC_LAN_BIND:127.0.0.1}:8555
  ice_servers: []
log:
  level: info
