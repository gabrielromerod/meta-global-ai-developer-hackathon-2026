evidence_kind: fixture
# Vigil camera configuration (spec 9.4, FR-001, FR-008, FR-030).
# Hosts and credentials come from .env on the edge machine; never put them here.
# Pixel coordinates are in the processed 1280x720 window frame.
# NOTE: geometry below is a SAMPLE used by tests and synthetic scenarios until the
# real cameras are probed (T-04) and calibrated (T-14). offset_s values come from T-07.
#
# Zones carry a `kind` (spec 9.4), which drives FR-008 origin tagging and FR-044 roles:
#   egress        a door of the house itself (never a garage door or any opening an outsider
#                 can reach without first appearing on a camera)
#   perimeter     where outsiders enter: street, driveway entry, side alley
#   interior_yard everything else (a plain polygon list is also read as interior_yard)
# Zone and line names are unique across all cameras (rule targets name them alone).
#
# hfov_deg: PLACEHOLDER nominal horizontal field of view (FR-036 fov_nominal intrinsics).
# Replace each value with the camera model's datasheet figure once T-04 confirms the models;
# until then 90.0 matches vigil.spatial.calibrate.DEFAULT_HFOV_DEG.
timezone: America/Los_Angeles
cameras:
  - id: front
    name: Front entrance
    source: {host_env: REOLINK_FRONT_HOST, channel: null}
    offset_s: 0.0
    hfov_deg: 90.0                                      # PLACEHOLDER until T-04 datasheet
    zones:
      front_door_egress: {kind: egress,        polygon: [[560, 300], [700, 300], [700, 560], [560, 560]]}
      porch:             {kind: interior_yard, polygon: [[420, 380], [860, 380], [860, 720], [420, 720]]}
      driveway:          {kind: interior_yard, polygon: [[0, 300], [400, 300], [400, 720], [0, 720]]}
      driveway_entry:    {kind: perimeter,     polygon: [[0, 300], [180, 300], [180, 720], [0, 720]]}
    privacy:
      - [[0, 0], [1280, 0], [1280, 140], [0, 140]]        # street and houses across
    exits:
      to_side_left: [[1180, 260], [1280, 260], [1280, 720], [1180, 720]]
  - id: side_left
    name: Left side
    source: {host_env: REOLINK_SIDE_LEFT_HOST, channel: null}
    offset_s: -0.42
    hfov_deg: 90.0                                      # PLACEHOLDER until T-04 datasheet
    zones:
      side_alley: {kind: perimeter,     polygon: [[200, 300], [420, 300], [420, 720], [200, 720]]}
      side_yard:  {kind: interior_yard, polygon: [[200, 300], [1100, 300], [1100, 720], [200, 720]]}
    lines:
      side_gate: [[812, 410], [870, 655]]
    exits:
      to_shed_back: [[1100, 380], [1280, 380], [1280, 720], [1100, 720]]
    privacy:
      - [[0, 0], [180, 0], [180, 720], [0, 720]]          # neighbour's wall and window
  - id: side_right
    name: Right side
    source: {host_env: REOLINK_SIDE_RIGHT_HOST, channel: null}
    offset_s: 0.0
    hfov_deg: 90.0                                      # PLACEHOLDER until T-04 datasheet
    zones:
      side_path: {kind: interior_yard, polygon: [[150, 280], [1130, 280], [1130, 720], [150, 720]]}
    privacy:
      - [[1100, 0], [1280, 0], [1280, 720], [1100, 720]]  # neighbour's house
  - id: backyard
    name: Backyard
    source: {host_env: REOLINK_BACKYARD_HOST, channel: null}
    offset_s: 0.0
    hfov_deg: 90.0                                      # PLACEHOLDER until T-04 datasheet
    zones:
      back_door_egress: {kind: egress,        polygon: [[600, 260], [760, 260], [760, 520], [600, 520]]}
      backyard:         {kind: interior_yard, polygon: [[0, 260], [1280, 260], [1280, 720], [0, 720]]}
blind_regions:            # written by `vigil spatial coverage` (FR-038); sample until T-17
  - {id: shed_back, name: behind the shed, polygon_m: [[4.1, 9.0], [7.3, 9.0], [7.3, 11.2], [4.1, 11.2]]}
topology:
  - {from: side_left, exit: to_shed_back, to: shed_back, blind: true}
  - {from: shed_back, to: side_left, min_s: 5, max_s: 180, blind: true}
  - {from: front, to: side_left, min_s: 2, max_s: 20}
  - {from: side_left, to: front, min_s: 2, max_s: 20}
  - {from: side_left, to: backyard, min_s: 3, max_s: 30}
  - {from: backyard, to: side_left, min_s: 3, max_s: 30}
  - {from: front, to: side_right, min_s: 2, max_s: 20}
  - {from: side_right, to: front, min_s: 2, max_s: 20}
  - {from: side_right, to: backyard, min_s: 3, max_s: 30}
  - {from: backyard, to: side_right, min_s: 3, max_s: 30}
